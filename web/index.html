<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spatial Pipeline Demo</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    />
    <style>
      html, body, #map { margin: 0; height: 100%; }
      #legend {
        position: absolute; top: 10px; left: 10px; z-index: 1;
        background: #fff; padding: 10px 12px; border-radius: 6px;
        font: 13px/1.4 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3);
      }
      .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="legend">
      <strong>Points by region</strong><br />
      <span class="swatch" style="background:#e6194b"></span>West<br />
      <span class="swatch" style="background:#3cb44b"></span>Central<br />
      <span class="swatch" style="background:#4363d8"></span>East
    </div>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
